[client]
# Es un comparador, no una fuente de datos: sin descarga ni copia de las tablas.
disableDataExport = true
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

# Colores iguales a paleta.py (test_colorimetria.py comprueba que coincidan).
# Auditoría de contraste y daltonismo: docs/colorimetria.md.
[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
headingFontWeights = [800, 800, 700, 700, 600, 600]
baseRadius = "0.8rem"
buttonRadius = "0.8rem"
showWidgetBorder = true
chartCategoricalColors = ["#2a78d6", "#f15a25", "#1baf7a", "#e8a317"]

[theme.light]
primaryColor = "#8b3dff"
linkColor = "#6d28d9"
backgroundColor = "#f7f7fb"
secondaryBackgroundColor = "#f1effa"
textColor = "#16142b"
borderColor = "#e8e7f1"
dataframeBorderColor = "#e8e7f1"

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4efff"

[theme.dark]
primaryColor = "#8b3dff"
linkColor = "#c4b5fd"
backgroundColor = "#0f0e1c"
secondaryBackgroundColor = "#1d1b35"
textColor = "#eeedf9"
borderColor = "#2b2946"
dataframeBorderColor = "#2b2946"
chartCategoricalColors = ["#3987e5", "#bd3311", "#199e70", "#c17f11"]

[theme.dark.sidebar]
backgroundColor = "#131224"
secondaryBackgroundColor = "#231c47"
